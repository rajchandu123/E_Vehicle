<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChargeSense — EV Intelligence &amp; Ownership OS</title>
    <meta
      name="description"
      content="Unified explainable decision layer for EV charging, range estimation, battery health, trip planning, and digital records along the Bengaluru–Mysuru corridor."
    />
    <meta property="og:title" content="ChargeSense — EV Intelligence &amp; Ownership OS" />
    <meta
      property="og:description"
      content="Unified explainable decision layer for EV charging, range estimation, battery health, trip planning, and digital records along the Bengaluru–Mysuru corridor."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('chargesense_theme') || 'dark';
          var useDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', useDark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[var(--cs-primary)] selection:text-[#061B14]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
